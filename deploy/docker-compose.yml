# =============================================================================
#  docker-compose.yml — « Gestion de tournois » sur le VPS
#
#  Utilisation (depuis n'importe quel dossier) :
#    docker compose -f /opt/tournois/repo/deploy/docker-compose.yml up -d --build
#
#  Principes :
#   - AUCUN port ouvert sur Internet : seul Caddy (conteneur docker-caddy-1,
#     réseau externe « docker_agea ») joint le service par son nom « tournois ».
#   - Le port 8787 n'est publié que sur 127.0.0.1 (diagnostic local, curl).
#   - Les données vivent sur l'hôte dans /opt/tournois/data (base SQLite +
#     sauvegardes automatiques dans /opt/tournois/data/backups).
# =============================================================================

# Nom de projet FIXE : sans lui, Compose prendrait le nom du dossier (« deploy »)
# et les commandes lancées depuis le cron ou un autre dossier divergeraient.
name: tournois

services:
  tournois:
    build:
      # Le contexte est la racine du dépôt (le serveur a besoin de src/engine/).
      context: ..
      dockerfile: Dockerfile
    # Nom d'image explicite : l'installateur s'en sert (uid de « app », prune).
    image: gestion-tournois:local
    container_name: tournois
    restart: unless-stopped
    # Mini « init » fourni par Docker : transmet proprement SIGTERM à Node
    # (arrêt propre → fermeture propre de SQLite).
    init: true
    stop_grace_period: 15s

    environment:
      NODE_ENV: production
      PORT: "8787"
      DATA_DIR: /data
      STATIC_DIR: /app/dist
      # Horodatage lisible des sauvegardes (Node utilise ICU, pas besoin de tzdata).
      TZ: Europe/Paris
      # Cadence des sauvegardes automatiques (valeurs par défaut du serveur,
      # rappelées ici pour être ajustables sans toucher au code) :
      BACKUP_EVERY_MIN: "10"      # une copie toutes les 10 min…
      BACKUP_KEEP_FREQUENT: "48"  # …on garde les 48 dernières (8 h)
      BACKUP_KEEP_DAILY: "30"     # + 1 par jour, 30 jours

    volumes:
      # Données persistantes sur l'hôte (propriétaire : uid de « app », cf. install.sh).
      - /opt/tournois/data:/data

    ports:
      # Diagnostic local uniquement — JAMAIS 0.0.0.0. L'accès public passe par Caddy.
      - "127.0.0.1:8787:8787"

    networks:
      - docker_agea

    # Limites raisonnables pour ne jamais gêner les autres services du VPS.
    mem_limit: 512m
    pids_limit: 256

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # Réseau EXISTANT, créé par la pile AGEA (/opt/agea/docker) : on s'y rattache,
  # on ne le crée ni ne le supprime jamais (« external »).
  docker_agea:
    external: true
